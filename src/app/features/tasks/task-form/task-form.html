<h2>Nueva tarea</h2>
<form
  [formGroup]="taskform"
  (ngSubmit)="onSubmit()"
>
  <div>
    <label for="title">
      Título
    </label>

    <input
      type="text"
      id="title"
      name="title"
      formControlName="title"
      placeholder="Ingrese una tarea"
      (input)="clearFieldError('title')"
      [readonly]="creating()"      
    />
    <app-field-error 
    [control]="taskform.controls.title"
    label="El Título"
    [backendError]="fieldErrors()['title'] ?? null">
    </app-field-error>
  </div>
  <div>
    <label for="description">Descripción</label>
    <textarea id="description"
    formControlName="description"
    rows="4"
    (input)="clearFieldError('description')">
    </textarea>
    <app-field-error
    [control]="taskform.controls.description"
    label="La Descripción"
    [backendError]="fieldErrors()['description'] ?? null">
    </app-field-error>
  </div>
  <div>
    <label for="priority">Prioridad</label>
    <select id="priority"
    formControlName="priority"
    (change)="clearFieldError('priority')">
      <option value="LOW">Baja</option>
      <option value="MEDIUM">Media</option>
      <option value="HIGH">Alta</option>
    </select>
    <app-field-error
    [control]="taskform.controls.priority"
    label="La Prioridad"
    [backendError]="fieldErrors()['priority'] ?? null">
    </app-field-error>
  </div>
  <div>
      <label for="dueDate">Fecha de vencimiento</label>
      <input type="date"
      id="dueDate"
      formControlName="dueDate"
      (change)="clearFieldError('dueDate')">
      <app-field-error
      [control]="taskform.controls.dueDate"
      label="La Fecha de vencimiento"
      [backendError]="fieldErrors()['dueDate'] ?? null">
      </app-field-error>
  </div>

  @if (createError(); as errorMessage) {
    <p class="error-message">
      {{errorMessage}}
    </p>
  }

  <button
    type="submit"
    [disabled]="taskform.invalid || creating()"
  >
    @if (creating()) {
      Guardando...
    } @else {
      Guardar
    }
  </button>

  <button
    type="button"
    (click)="cancel()"
    [disabled]="creating()"
  >
    Cancelar
  </button>
</form>
