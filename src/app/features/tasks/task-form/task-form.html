<form
    [formGroup]="taskform"
    (ngSubmit)="onSubmit()">

    <label for="task-title">
        Nueva Tarea
    </label>

    <input id="task-title" type="text" formControlName="title" placeholder="Ingrese el título de la tarea">

    @if(taskform.controls.title.invalid && taskform.controls.title.touched){
        <div>
            @if(taskform.controls.title.hasError('required')){
                <small>El título es obligatorio.</small>
            }

            @if(taskform.controls.title.hasError('minlength')){
                <small>El título debe tener al menos 3 caracteres.</small>
            }
        </div>
    }
    <button type="submit" [disabled]="taskform.invalid">
        Agregar Tarea
    </button>
</form>
