<h2>Nueva tarea</h2>

<form
  [formGroup]="taskform"
  (ngSubmit)="onSubmit()"
>
  <div>
    <label for="title">
      Título
    </label>

    <input
      type="text"
      id="title"
      name="title"
      formControlName="title"
      placeholder="Ingrese una tarea"
      (input)="clearFieldError('title')"
      [readonly]="creating()"      
    />
    <app-field-error 
    [control]="taskform.controls.title"
    label="El Título"
    [backendError]="fieldErrors()['title'] ?? null">
    </app-field-error>
  </div>

  @if (createError(); as errorMessage) {
    <p class="error-message">
      {{errorMessage}}
    </p>
  }

  <button
    type="submit"
    [disabled]="taskform.invalid || creating()"
  >
    @if (creating()) {
      Guardando...
    } @else {
      Guardar
    }
  </button>

  <button
    type="button"
    (click)="cancel()"
    [disabled]="creating()"
  >
    Cancelar
  </button>
</form>
