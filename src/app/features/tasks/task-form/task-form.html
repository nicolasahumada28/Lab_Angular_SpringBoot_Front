<section>
    <h2>Nueva Tarea</h2>
    <form [formGroup]="taskform" (ngSubmit)="onSubmit()">

        <div>
            <label for="title">
                Título
            </label>

            <input id="title" type="text" formControlName="title" placeholder="Ingrese el título de la tarea">

            @if(taskform.controls.title.hasError('required') && taskform.controls.title.touched){
            <p>El título es obligatorio.</p>
            }
            @if(taskform.controls.title.hasError('minlength') && taskform.controls.title.touched){
            <p>El título debe tener al menos 3 caracteres.</p>
            }
        </div>
        <div>
            <button type="submit" [disabled]="taskform.invalid">
                Agregar Tarea
            </button>
            <a routerLink="/tasks">Cancelar</a>
        </div>
    </form>
</section>
